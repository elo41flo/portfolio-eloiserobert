<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over — Page introuvable | Eloise Robert</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0d0b1e">

    <!-- Mêmes préférences (thème, accessibilité) que sur le portfolio -->
    <script src="/layout.js"></script>

    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Chemins absolus : la 404 peut s'afficher à n'importe quelle adresse -->
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
</head>
<body>
    <div class="crt" aria-hidden="true"></div>

    <main class="gameover">
        <p class="gameover-code">ERREUR 404</p>
        <h1 class="gameover-title">GAME OVER</h1>

        <div class="dialog-box">
            <span class="dialog-name">SYSTÈME</span>
            <p>Oups ! Ce niveau n'existe pas… Tu viens de tomber dans un trou de la map. La page a peut-être été déplacée, ou l'adresse contient une faute de frappe.</p>
        </div>

        <p class="continue" aria-live="polite">CONTINUE ? <strong id="countdown">9</strong></p>

        <div class="gameover-actions">
            <a href="/" class="pixel-btn" id="continue-btn">▶ Continuer (accueil)</a>
            <a href="/arcade.html" class="pixel-btn alt">👾 Jouer au Snake</a>
            <a href="/contact.html?objet=autre" class="pixel-btn alt">💾 Signaler un bug</a>
        </div>
    </main>

    <script src="/404.js"></script>
</body>
</html>
